name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.0.0
        required: true
        default: v2.0.0

jobs:
  native:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            package: darwin-arm64
            binary: claude-adapter-native
          - runner: macos-15-intel
            package: darwin-x64
            binary: claude-adapter-native
          - runner: ubuntu-24.04
            package: linux-x64-gnu
            binary: claude-adapter-native
          - runner: ubuntu-24.04-arm
            package: linux-arm64-gnu
            binary: claude-adapter-native
          - runner: windows-2025
            package: win32-x64-msvc
            binary: claude-adapter-native.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo build --manifest-path native/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package }}
          path: native/target/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Package and create GitHub release
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage platform binaries
        run: |
          mkdir -p npm/darwin-arm64/bin npm/darwin-x64/bin npm/linux-arm64-gnu/bin npm/linux-x64-gnu/bin npm/win32-x64-msvc/bin
          cp artifacts/native-darwin-arm64/claude-adapter-native npm/darwin-arm64/bin/
          cp artifacts/native-darwin-x64/claude-adapter-native npm/darwin-x64/bin/
          cp artifacts/native-linux-arm64-gnu/claude-adapter-native npm/linux-arm64-gnu/bin/
          cp artifacts/native-linux-x64-gnu/claude-adapter-native npm/linux-x64-gnu/bin/
          cp artifacts/native-win32-x64-msvc/claude-adapter-native.exe npm/win32-x64-msvc/bin/
          chmod +x npm/darwin-*/bin/* npm/linux-*/bin/*
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml
      - name: Build package artifacts and clean-install test
        env:
          RELEASE_BINARIES_STAGED: '1'
          REQUIRE_ALL_PLATFORMS: '1'
          CLEAN_INSTALL: '1'
        run: npm run release:assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip release/*.tgz --title "$RELEASE_TAG" --generate-notes
